<!-- Grid Dashboard Areas -->
<!DOCTYPE html>
<html>
<head>
    <title>Grid Dashboard Areas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f1f3f6;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 60px 1fr 50px;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            min-height: 100vh;
            gap: 10px;
            padding: 10px;
        }
        .header {
            grid-area: header;
            background: #2878c8;
            color: white;
            padding: 15px;
        }
        .sidebar {
            grid-area: sidebar;
            background: #34495e;
            color: white;
            padding: 20px;
        }
        .main {
            grid-area: main;
            background: white;
            padding: 20px;
        }
        .footer {
            grid-area: footer;
            background: #2878c8;
            color: white;
            text-align: center;
            padding: 15px;
        }
        .box {
            background: #e8f0fa;
            padding: 20px;
            margin: 10px 0;
            border-radius: 5px;
        }
        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <h2>My Dashboard</h2>
        </header>
        <aside class="sidebar">
            <h3>Menu</h3>
            <p>Home</p>
            <p>Profile</p>
            <p>Settings</p>
            <p>Reports</p>
        </aside>
        <main class="main">
            <h2>Dashboard Overview</h2>
            <div class="box">
                <h3>Total Students</h3>
                <p>250 Students</p>
            </div>
            <div class="box">
                <h3>Completed Courses</h3>
                <p>18 Courses</p>
            </div>
            <div class="box">
                <h3>Pending Tasks</h3>
                <p>5 Tasks</p>
            </div>
        </main>
        <footer class="footer">
            My Dashboard | 2026
        </footer>
    </div>
</body>
</html>
