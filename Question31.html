<!-- flex menu bar -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Menu Bar</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f2f2f2;
}
h1 {
    text-align: center;
    color: darkblue;
    margin-top: 30px;
}
nav {
    background-color: darkblue;
    padding: 15px;
}
.menu {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    list-style: none;
    margin: 0;
    padding: 0;
}
.menu a {
    color: white;
    text-decoration: none;
    font-size: 17px;
}
.menu a:hover {
    color: yellow;
}
.container {
    text-align: center;
    margin: 50px auto;
    padding: 20px;
}
@media (max-width: 500px) {
    .menu {
        flex-direction: column;
        gap: 15px;
    }
}
</style>
</head>
<body>
<h1>Flexbox Navigation Menu</h1>
<nav>
<ul class="menu">
<li><a href="#home">Home</a></li>
<li><a href="#about">About</a></li>
<li><a href="#services">Services</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>
<div class="container" id="home">
<h2>Welcome to My Website</h2>
<p>This is a simple navigation menu created using CSS Flexbox.</p>
<p>Flexbox helps arrange menu items in a row or column.</p>
</div>
</body>
</html>
