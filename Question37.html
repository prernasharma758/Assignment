<!-- Grid Auto Fit Products -->
<!DOCTYPE html>
<html>
<head>
    <title>Grid Auto Fit Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 30px auto;
        }
        .card {
            background: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 6px #ccc;
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 6px;
        }
        .card button {
            background: #2878c8;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Our Products</h1>
    <div class="products">
        <div class="card">
            <img src="https://picsum.photos/id/250/400/300" alt="Laptop">
            <h3>Laptop</h3>
            <p>Price: ₹45,000</p>
            <button>View Product</button>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/160/400/300" alt="Headphones">
            <h3>Headphones</h3>
            <p>Price: ₹1,500</p>
            <button>View Product</button>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1/400/300" alt="Mobile">
            <h3>Smartphone</h3>
            <p>Price: ₹18,000</p>
            <button>View Product</button>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/20/400/300" alt="Camera">
            <h3>Camera</h3>
            <p>Price: ₹25,000</p>
            <button>View Product</button>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/96/400/300" alt="Watch">
            <h3>Smart Watch</h3>
            <p>Price: ₹3,000</p>
            <button>View Product</button>
        </div>
    </div>
</body>
</html>
