<!-- Flexbox Landing Section -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Landing Section</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f4f6f9;
}
header {
    background-color: darkblue;
    color: white;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
header h2 {
    margin: 0;
}
nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}
.landing {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 60px 40px;
    gap: 30px;
    min-height: 400px;
}
.content {
    max-width: 450px;
}
.content h1 {
    color: darkblue;
    font-size: 36px;
}
.content p {
    color: #444;
    font-size: 17px;
    line-height: 1.6;
}
.landing img {
    width: 400px;
    max-width: 100%;
    border-radius: 10px;
}
button {
    background-color: darkblue;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background-color: darkgreen;
}
footer {
    background-color: darkblue;
    color: white;
    text-align: center;
    padding: 15px;
}
@media (max-width: 650px) {
    header {
        flex-direction: column;
        gap: 15px;
    }
    .landing {
        flex-direction: column;
        text-align: center;
        padding: 30px 20px;
    }
    .content h1 {
        font-size: 28px;
    }
}
</style>
</head>
<body>
<header>
<h2>LearnHub</h2>
<nav>
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</nav>
</header>
<section class="landing" id="home">
<div class="content">
<h1>Learn New Skills Every Day</h1>
<p>Explore technology, improve your knowledge and develop practical skills with our learning platform.</p>
<button>Get Started</button>
</div>
<img src="https://picsum.photos/500/350" alt="Learning and technology">
</section>
<section id="about" style="text-align:center;padding:30px;">
<h2>About LearnHub</h2>
<p>LearnHub is a simple platform designed to encourage learning and creativity.</p>
</section>
</body>
</html>
