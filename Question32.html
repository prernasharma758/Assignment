<!-- centered login form -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Centered Login</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #eaf0f6;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.login-box {
    background-color: white;
    width: 300px;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px lightgray;
}
h1 {
    text-align: center;
    color: darkblue;
}
label {
    display: block;
    margin-top: 15px;
}
input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid gray;
    border-radius: 5px;
    box-sizing: border-box;
}
button {
    width: 100%;
    padding: 10px;
    margin-top: 20px;
    background-color: darkblue;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background-color: darkgreen;
}
p {
    text-align: center;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="login-box">
<h1>Login</h1>
<form action="#" method="post">
<label>Email</label>
<input type="email" name="email" placeholder="Enter your email" required>
<label>Password</label>
<input type="password" name="password" placeholder="Enter your password" required>
<button type="submit">Login</button>
</form>
<p>Welcome back! Please login to continue.</p>
</div>
</body>
</html>
