<!-- Job Application Form -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Form</title>
</head>
<body>
<h1>Job Application Form</h1>
<p>Please fill in the details to apply for the job.</p>
<form>
<label for="name">Full Name:</label><br>
<input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>
<label for="email">Email Address:</label><br>
<input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
<label for="phone">Phone Number:</label><br>
<input type="tel" id="phone" name="phone" placeholder="Enter phone number" required><br><br>
<label for="dob">Date of Birth:</label><br>
<input type="date" id="dob" name="dob"><br><br>
<label for="position">Applying For:</label><br>
<select id="position" name="position">
<option value="">Select Position</option>
<option value="Web Developer">Web Developer</option>
<option value="Data Analyst">Data Analyst</option>
<option value="Software Developer">Software Developer</option>
<option value="AI Analyst">AI Analyst</option>
</select><br><br>
<label for="education">Highest Qualification:</label><br>
<input type="text" id="education" name="education" placeholder="Enter your qualification"><br><br>
<label for="experience">Work Experience:</label><br>
<select id="experience" name="experience">
<option value="">Select Experience</option>
<option value="Fresher">Fresher</option>
<option value="1-2 Years">1-2 Years</option>
<option value="3-5 Years">3-5 Years</option>
<option value="Above 5 Years">Above 5 Years</option>
</select><br><br>
<label for="skills">Technical Skills:</label><br>
<textarea id="skills" name="skills" rows="4" cols="30" placeholder="Enter your skills"></textarea><br><br>
<label for="resume">Upload Resume:</label><br>
<input type="file" id="resume" name="resume"><br><br>
<label for="message">Why should we hire you?</label><br>
<textarea id="message" name="message" rows="4" cols="30" placeholder="Write a short introduction"></textarea><br><br>
<input type="checkbox" id="declaration" name="declaration" required>
<label for="declaration">I confirm that the information provided is correct.</label><br><br>
<input type="submit" value="Submit Application">
<input type="reset" value="Reset">
</form>
</body>
</html>
