<!--grid products-->
<!DOCTYPE html>
<html>
<head>
    <title>Grid Products Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }
        .container {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 70px 1fr;
            grid-template-areas:
                "header header"
                "sidebar products";
            min-height: 100vh;
            gap: 15px;
            padding: 15px;
        }
        .header {
            grid-area: header;
            background: #2878c8;
            color: white;
            padding: 10px 20px;
        }
        .sidebar {
            grid-area: sidebar;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .products {
            grid-area: products;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
        }
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
        }
        .card button {
            background: #2878c8;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "sidebar"
                    "products";
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h2>Online Shopping</h2>
        </header>
        <aside class="sidebar">
            <h3>Categories</h3>
            <p>Electronics</p>
            <p>Clothing</p>
            <p>Accessories</p>
            <p>Home Products</p>
        </aside>
        <main class="products">
            <div class="card">
                <img src="https://picsum.photos/id/1/300/200" alt="Laptop">
                <h3>Laptop</h3>
                <p>₹45,000</p>
                <button>Buy Now</button>
            </div>
            <div class="card">
                <img src="https://picsum.photos/id/160/300/200" alt="Headphones">
                <h3>Headphones</h3>
                <p>₹1,500</p>
                <button>Buy Now</button>
            </div>
            <div class="card">
                <img src="https://picsum.photos/id/250/300/200" alt="Camera">
                <h3>Camera</h3>
                <p>₹25,000</p>
                <button>Buy Now</button>
            </div>
            <div class="card">
                <img src="https://picsum.photos/id/96/300/200" alt="Watch">
                <h3>Smart Watch</h3>
                <p>₹3,000</p>
                <button>Buy Now</button>
            </div>
        </main>
    </div>
</body>
</html>
