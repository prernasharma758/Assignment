<!-- CSS Selector Types -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Selector Types</title>
<style>
* {
    font-family: Arial, sans-serif;
}
body {
    background-color: #f2f2f2;
    padding: 20px;
}
h1 {
    color: darkblue;
    text-align: center;
}
.heading {
    color: green;
}
#special {
    color: red;
    font-size: 20px;
}
h2, h3 {
    color: purple;
}
div p {
    background-color: lightyellow;
    padding: 10px;
}
</style>
</head>
<body>
<h1>CSS Selector Types</h1>
<h2>Element Selector</h2>
<p>This paragraph is styled using an element selector.</p>
<h2 class="heading">Class Selector</h2>
<p class="heading">This paragraph uses a class selector.</p>
<h2 id="special">ID Selector</h2>
<p>This heading is styled using an ID selector.</p>
<h3>Grouping Selector</h3>
<div>
<p>This paragraph uses a descendant selector.</p>
</div>
</body>
</html>
