<!-- Flex Wrap Products -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Wrap Products</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    margin: 20px;
}
h1 {
    text-align: center;
    color: darkblue;
}
.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
}
.product {
    background-color: white;
    width: 220px;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 3px 8px lightgray;
    text-align: center;
}
.product img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 5px;
}
.product h2 {
    color: darkblue;
    font-size: 20px;
}
.price {
    color: darkgreen;
    font-size: 18px;
    font-weight: bold;
}
button {
    background-color: darkblue;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background-color: darkgreen;
}
</style>
</head>
<body>
<h1>Our Products</h1>
<p style="text-align:center;">Explore our latest products.</p>
<div class="container">
<div class="product">
<img src="https://picsum.photos/220/140?random=11" alt="Laptop">
<h2>Laptop</h2>
<p>Useful for study and work.</p>
<p class="price">₹45,000</p>
<button>Buy Now</button>
</div>
<div class="product">
<img src="https://picsum.photos/220/140?random=12" alt="Headphones">
<h2>Headphones</h2>
<p>Enjoy clear and quality sound.</p>
<p class="price">₹1,500</p>
<button>Buy Now</button>
</div>
<div class="product">
<img src="https://picsum.photos/220/140?random=13" alt="Smart Watch">
<h2>Smart Watch</h2>
<p>Track your daily activities.</p>
<p class="price">₹2,500</p>
<button>Buy Now</button>
</div>
<div class="product">
<img src="https://picsum.photos/220/140?random=14" alt="Keyboard">
<h2>Keyboard</h2>
<p>Comfortable typing experience.</p>
<p class="price">₹800</p>
<button>Buy Now</button>
</div>
</div>
</body>
</html>
