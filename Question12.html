<!-- Images with Alt -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Images with Alt</title>
</head>
<body>
<h1>My Favourite Images</h1>
<h2>Nature</h2>
<img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400" alt="Beautiful green mountains and nature" width="300">
<h2>Flowers</h2>
<img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=400" alt="Beautiful colourful flowers" width="300">
<h2>Technology</h2>
<img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=400" alt="Electronic technology circuit board" width="300">
<h2>Books</h2>
<img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=400" alt="Books arranged on a bookshelf" width="300">
<p>Images make a webpage attractive and informative. The alt attribute provides alternative text when an image cannot be displayed.</p>
</body>
</html>
